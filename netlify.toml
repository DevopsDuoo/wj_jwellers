# Netlify Configuration for WJ Jewellers
# 100% Pure Static Deployment (Zero-build)

[build]
  # Publish the root directory where index.html is located
  publish = "."
  # Leave command empty so Netlify does not attempt npm/yarn builds
  command = ""

[[redirects]]
  # Ensure all route requests resolve to index.html with HTTP 200
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
